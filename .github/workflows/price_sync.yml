name: USJ815 価格自動同期

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 23:00 UTC = 翌朝 8:00 JST
  workflow_dispatch:       # GitHub画面から手動実行も可能

jobs:
  sync-price:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 価格同期スクリプトを実行
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: python price_sync.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "価格自動更新: $(date +'%Y-%m-%d')"
          git push
